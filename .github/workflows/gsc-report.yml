name: GSC URL status report

# Weekly export of Google Search Console indexing status for every URL
# in the shipped sitemaps. Publishes reports/gsc-status-<date>.{md,csv}
# as a build artifact so the team can track which URLs are still stuck
# as "N/A" (never crawled).
#
# Exit code 2 from the script (= there are still N/A URLs) is treated as
# a warning, not a failure — the artifact is what matters. Real errors
# (missing creds, gateway failure) return 1 and fail the job.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tsx
        run: npm install --no-save tsx

      - name: Generate GSC status report
        id: report
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          GOOGLE_SEARCH_CONSOLE_API_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_API_KEY }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL || 'https://genuinoinvestments.ch/' }}
          GSC_ERROR_RATE_THRESHOLD: ${{ vars.GSC_ERROR_RATE_THRESHOLD || '0.1' }}
          NA_ALERT_LIMIT: ${{ vars.NA_ALERT_LIMIT || '25' }}
        run: |
          set +e
          npx tsx scripts/gsc-url-status-report.ts
          code=$?
          if [ "$code" -eq 1 ]; then exit 1; fi
          exit 0

      - name: Track stale N/A URLs & open GitHub issues
        id: track
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STALE_DAYS: "14"
          NA_ALERT_LIMIT: ${{ vars.NA_ALERT_LIMIT || '25' }}
        run: npx tsx scripts/gsc-track-na-urls.ts

      - name: Slack alert on threshold breach
        if: >
          always() &&
          (steps.report.outputs.over_error_threshold == 'true' ||
           steps.report.outputs.over_na_limit == 'true' ||
           steps.track.outputs.over_limit == 'true')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping Slack alert."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=":rotating_light: *GSC threshold breached* — errors=${{ steps.report.outputs.errors }} error_rate=${{ steps.report.outputs.error_rate }} na=${{ steps.report.outputs.na }} (limit ${{ vars.NA_ALERT_LIMIT || '25' }})\n<${RUN_URL}|View run>"
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg t "$TEXT" '{text:$t}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Email alert on threshold breach
        if: >
          always() &&
          (steps.report.outputs.over_error_threshold == 'true' ||
           steps.report.outputs.over_na_limit == 'true' ||
           steps.track.outputs.over_limit == 'true')
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USER }}
          to: ${{ vars.SEO_ALERT_EMAIL }}
          subject: "[GSC alert] N/A or error threshold breached"
          body: |
            The weekly Google Search Console inspection breached configured thresholds.

            errors=${{ steps.report.outputs.errors }}
            error_rate=${{ steps.report.outputs.error_rate }}
            na=${{ steps.report.outputs.na }} (limit ${{ vars.NA_ALERT_LIMIT || '25' }})
            over_error_threshold=${{ steps.report.outputs.over_error_threshold }}
            over_na_limit=${{ steps.report.outputs.over_na_limit }}

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit updated N/A history
        run: |
          if [ -z "$(git status --porcelain reports/gsc-na-history.json)" ]; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/gsc-na-history.json
          git commit -m "chore(seo): update GSC N/A history [skip ci]"
          git push

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-status-report
          path: reports/gsc-status-*.*
          if-no-files-found: warn
