name: Sitemap refresh

# Regenerates <lastmod> across every public/sitemap*.xml whenever content
# that appears in the sitemap changes on main, then commits + pushes the
# refreshed files. Also runs on a weekly schedule as a safety net and is
# manually dispatchable. The hreflang/canonical validator runs after the
# refresh so a bad edit fails CI before it hits production.

on:
  push:
    branches: [main]
    paths:
      - "src/pages/**"
      - "src/data/**"
      - "src/App.tsx"
      - "public/sitemap*.xml"
      - "supabase/migrations/**"
      - "scripts/refresh-sitemap-lastmod.ts"
      - "scripts/validate-hreflang.ts"
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tsx
        run: npm install --no-save tsx

      - name: Refresh sitemap lastmod
        run: npx tsx scripts/refresh-sitemap-lastmod.ts

      - name: Validate hreflang & canonical consistency
        run: npx tsx scripts/validate-hreflang.ts

      - name: Validate sitemap host
        run: npx tsx scripts/validate-sitemap-host.ts

      - name: Commit & push refreshed sitemaps
        run: |
          if [ -z "$(git status --porcelain public/sitemap*.xml)" ]; then
            echo "No sitemap changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sitemap*.xml
          git commit -m "chore(sitemap): refresh lastmod [skip ci]"
          git push
